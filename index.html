<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asado Match - Punta del Diablo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Modo oscuro activado por la clase "dark" en <html> (ver App.tsx)
      tailwind.config = { darkMode: 'class' };
    </script>
    <script>
      // Aplica el tema guardado antes del primer render para evitar un parpadeo.
      // Sin preferencia guardada, sigue el tema del sistema.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('asado-theme'); } catch (e) {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #fdfbf7;
        color: #44403c;
      }
      html.dark { color-scheme: dark; }
      html.dark body {
        background-color: #1c1917; /* stone-900 */
        color: #e7e5e4; /* stone-200 */
      }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
      @keyframes gradient-xy {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
      }
      .animate-gradient {
          background-size: 200% 200%;
          animation: gradient-xy 6s ease infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
